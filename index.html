                        !qrCode.isDark(row + 1, col) &&
                         qrCode.isDark(row + 2, col) &&

            for (row = 0; row < moduleCount; row++) {
                if (qrCode.isDark(row, col) ) {
                    darkCount++;
                }
            }
        }

function show(title,body,foot=''){ $('content').innerHTML=`<div class="eyebrow">Professor Arthur William • Produção Audiovisual</div><h2 id="modalTitle">${esc(title)}</h2>${body}${foot?`<div class="foot">${foot}</div>`:''}`;if(!modal.open)modal.showModal();}
function close(){modal.close();update();}

function speak(t){if(state.voice&&'speechSynthesis'in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='pt-BR';speechSynthesis.speak(u)}}
function message(t,kind=''){const el=$('feedback');el.hidden=false;el.className='chip '+kind;el.textContent=t;clearTimeout(feedbackTimer);feedbackTimer=setTimeout(()=>el.hidden=true,6000);speak(t)}
function event(ok,t){state[ok?'oks':'errors']++;state.log.push({step:state.step+1,ok,t});message(t,ok?'good':'bad');update();}
function note(t,ok=false){const e=$('note');if(e){e.className='note '+(ok?'good':'bad');e.textContent=t}event(ok,t)}

function intro(){show('Bem-vindo ao Laboratório Audiovisual Senac',`<p>Você é responsável por preparar uma gravação profissional. Escolha a Ordem do Dia, separe o kit e execute os 14 procedimentos no estúdio.</p><label for="studentName">Nome do estudante</label><input id="studentName" maxlength="80" autocomplete="name" placeholder="Digite seu nome"><label>Escolha o avatar</label><div class="grid"><button class="tile selected" id="male">Técnico em formação</button><button class="tile" id="female">Técnica em formação</button></div><div id="nameError" class="muted" role="status"></div><p class="muted">Use WASD ou as setas para andar e E para interagir. No celular, use as setas na tela. As interações 2D são feitas com clique ou toque.</p>`,btn('Entrar na sala de aula','start',true));for(const [id,g] of [['male','m'],['female','f']])bind(id,()=>{state.gender=g;$(id).classList.add('selected');$(id==='male'?'female':'male').classList.remove('selected');visual?.gender(g)});bind('start',()=>{const name=$('studentName').value.trim();if(!name){$('nameError').textContent='Informe seu nome.';return}state.name=name;state.started=true;close();message('Aproxime-se do Professor Arthur William para escolher sua Ordem do Dia.');});}

function choose(c){Object.assign(state,{kase:c,step:0,index:0,held:false,errors:0,oks:0,log:[],clapped:false,action:false,cams:Array.from({length:c.n},()=>({mounted:false,sd:false,battery:false,receivers:0,powered:false,audio:false,wb:false,frame:false,rec:false}))});showKit();}
function expected(){const c=state.kase;return Object.fromEntries(ITEMS.map(([id])=>[id,id===c.mic?c.m:['camera','sd','battery'].includes(id)?c.n:id==='clap'?1:0]))}
function showKit(){const c=state.kase;show('OD 0'+c.id+' — Separação do kit',`<h3>${esc(c.title)}</h3><p>${esc(c.brief)}</p><p>Informe a quantidade de cada item (zero para os desnecessários). Tripés, spots e receptores compatíveis já estão disponíveis no estúdio.</p>${ITEMS.map(([id,name])=>`<label class="kitrow" for="kit-${id}">${name}<input id="kit-${id}" type="number" min="0" max="6" step="1" value="0"></label>`).join('')}<div id="note" class="note" aria-live="polite">Confira o briefing antes de confirmar.</div>`,btn('Trocar Ordem do Dia','back')+btn('Conferir kit','check',true));bind('back',()=>{state.kase=null;board()});bind('check',()=>{const exp=expected(),bad=ITEMS.filter(([id])=>Number($('kit-'+id).value)!==exp[id]||$('kit-'+id).value==='');if(bad.length){note('Revise: '+bad.map(([id,name])=>name+' (necessário: '+exp[id]+')').join('; ')+'.');return}event(true,'Kit correto para a Ordem do Dia.');state.step=0;state.index=0;close();message('Kit aprovado. Dirija-se à porta do Laboratório Audiovisual Senac.','good');});}

function target(){if(state.scene==='class')return state.kase?'door':'teacher';if(state.step===0)return state.held?'tripod'+state.index:'camera'+state.index;if(state.step===1)return 'sd'+state.index;if(state.step===5)return 'rx'+state.index;if(state.step===7)return 'tripod'+state.index;if(state.step===12)return 'clap';if(state.step===13)return 'action';return null}
function cameraLabel(i=state.index){return 'Câmera '+(i+1)}

function activate(id){if(modal.open||!state.started)return;if(state.scene==='class'){if(id==='teacher'&&!state.kase){board();return}if(id==='teacher'&&state.kase){sheet();return}if(id==='door'&&state.kase){startStudio();return}if(id==='door'){message('Selecione primeiro uma Ordem do Dia com o professor.');return}return;}const needed=target();if(!needed){minigame();return}if(id!==needed){event(false,'Objeto inadequado nesta etapa. '+prompt());return}const i=state.index,c=state.cams[i];switch(state.step){case 0:if(!state.held){state.held=true;visual?.pick(i);message('Câmera em mãos. Vá ao tripé indicado.','good');update()}else{c.mounted=true;visual?.mount(i);advance(cameraLabel()+' instalada no tripé.')}break;case 1:visual?.take('sd',i);advance('Cartão '+(i+1)+' recolhido.');break;case 5:visual?.take('rx',i);advance('Receptor '+(i+1)+' recolhido.');break;case 7:powerGame();break;case 12:if(!state.cams.every(x=>x.rec)){event(false,'Inicie REC em todas as câmeras antes da claquete.');return}state.clapped=true;visual?.clap();advance('Claquete batida com todas as câmeras gravando.');break;case 13:if(!state.clapped){event(false,'Bata a claquete antes da ação.');return}state.action=true;visual?.action();speak('Ação!');advance('AÇÃO! Gravação iniciada.');break;}}
function interact(){if(modal.open||!state.started)return;if(!visual&&$('fallback').hidden){message('Carregando ambiente 3D.');return}if(!target()){minigame();return}if(!visual){activate(target());return}const near=visual.near();if(near)activate(near.id);else message('Aproxime-se do objeto destacado para interagir.');}
function sheet(){const c=state.kase;if(!c)return;show('Ordem do Dia 0'+c.id,`<h3>${esc(c.title)}</h3><p>${esc(c.brief)}</p><p>${esc(c.audio)}</p><p>Iluminação do cenário: ${c.wb} K. Planos solicitados: ${esc(c.frames.join(' • '))}.</p><ol>${STEPS.map((s,i)=>`<li>${state.scene==='studio'&&i<state.step?'✓ ':''}${esc(s)}</li>`).join('')}</ol>`,btn('Continuar','resume',true));bind('resume',close)}
function camPanel(text,body){show(cameraLabel()+' — '+STEPS[state.step],`<p>${esc(text)}</p><div class="cam-ui">${body}</div><div class="note" id="note" aria-live="polite">Selecione ou ajuste o controle solicitado.</div>`,btn('Voltar ao estúdio','pause'));bind('pause',close)}
function options(opts,correct,explain,success,apply=()=>{}){const order=opts.map((_,i)=>i);if(order.length>1){const offset=(state.step+state.index)%order.length;order.push(...order.splice(0,offset));}return `<div class="ports">${order.map(i=>`<button id="opt${i}">${esc(opts[i])}</button>`).join('')}</div>`}
function setOptions(opts,correct,explain,success,apply=()=>{}){opts.forEach((o,i)=>bind('opt'+i,()=>{if(i!==correct){note(explain[i]||'Revise o procedimento.');return}apply();advance(success)}))}
function powerGame(){const c=state.cams[state.index];const opts=['OFF','ON / vídeo','Remover bateria'];camPanel('Acione a chave física de alimentação no modo de vídeo.',`<svg class="camera-view" viewBox="0 0 500 150" role="img" aria-label="Painel superior de câmera"><rect x="90" y="18" width="320" height="112" rx="18" fill="#293b47"/><circle cx="180" cy="74" r="40" fill="#0b141b" stroke="#8996a0" stroke-width="5"/><text x="180" y="79" text-anchor="middle" fill="white">POWER</text><rect x="270" y="38" width="100" height="65" rx="5" fill="#0d1d24"/><text x="320" y="77" fill="#8bd3ff" text-anchor="middle">OFF</text></svg>${options(opts)}`);setOptions(opts,1,['OFF mantém a câmera desligada.','','A bateria já está instalada.'],'Câmera ligada no modo vídeo.',()=>{c.powered=true;visual?.power(state.index)});}

 const names={sd:['Cartão SD','Slot SD'],battery:['Bateria','Compartimento BAT'],rx:['Plugue P2 do receptor','MIC IN']};const labels=names[kind];
 const panel=document.createElement('div');panel.className='cam-ui';panel.innerHTML=`<p>Arraste ${labels[0]} para o destino correto ou selecione o objeto e toque no destino.</p><div class="ports"><button id="dragPart" draggable="true" aria-pressed="false">${labels[0]}</button><button id="destGood">${labels[1]}</button><button id="destBad">${kind==='rx'?'HDMI OUT':kind==='sd'?'Entrada MIC':'Slot SD'}</button></div><small id="physicalNote">Escolha o objeto para posicioná-lo.</small>`;document.querySelector('.cam-ui').append(panel);

}
function minigame(){if(state.scene!=='studio'||state.step>=14)return;const i=state.index,c=state.cams[i],k=state.kase;let opts,correct,explain,success,apply=()=>{};switch(state.step){case 2:opts=['SD alinhado ao slot, sem forçar','SD invertido, forçar encaixe','Conectar na entrada MIC'];correct=0;explain=['','A orientação errada pode danificar o slot.','O cartão deve ir ao slot SD.'];success='Cartão inserido corretamente.';apply=()=>c.sd=true;camPanel('Insira o cartão SD com os contatos na orientação do slot.',`<svg class="camera-view" viewBox="0 0 500 160"><rect x="180" y="20" width="250" height="120" rx="14" fill="#34434e"/><rect x="203" y="49" width="17" height="65" fill="#080f14" stroke="#a3b2bf"/><text x="250" y="45" fill="white">SD</text><path d="M62 40H115L135 60V123H62Z" fill="#647b91" stroke="#b7cbdc"/><text x="95" y="90" fill="white" text-anchor="middle">SD</text><path d="M144 80H192" stroke="#ffae3d" stroke-width="4"/></svg>${options(opts)}`);break;
case 3:opts=['Bateria compatível e carregada','Bateria descarregada','Pilha AA avulsa'];correct=0;explain=['','Uma bateria descarregada interrompe a gravação.','Selecione a bateria compatível com a DSLR.'];success='Bateria carregada separada na bancada.';apply=()=>visual?.take('battery',state.index);camPanel('Escolha uma bateria compatível com a DSLR.',options(opts));break;

case 6:{const dest=state.cams[i];opts=['MIC IN (3,5 mm)','HDMI OUT','USB de dados','Fone de ouvido'];correct=0;explain=['','HDMI é saída de vídeo.','USB de dados não é a entrada de microfone deste kit.','Fone é saída de monitoramento.'];success='Receptor '+(i+1)+' conectado à câmera '+(i+1)+'.';apply=()=>{dest.receivers++;visual?.connect(i)};camPanel('Conecte o receptor '+(i+1)+' na entrada de áudio da câmera '+(i+1)+'.',`<p>${esc(k.audio)}</p>${options(opts)}`);break}
case 8:audioGame();return;case 9:wbGame();return;case 10:frameGame();return;case 11:recGame();return;default:return;}if([2,4,6].includes(state.step)){let oriented=false;opts.forEach((o,j)=>bind('opt'+j,()=>{if(j!==correct){oriented=false;note(explain[j]||'Revise o procedimento.');return}oriented=true;const el=$('note');el.className='note good';el.textContent='Escolha correta. Agora posicione o componente.'; }));physicalInstall(state.step===2?'sd':state.step===4?'battery':'rx',()=>oriented,'Destino incompatível com o componente.',success,apply);return}setOptions(opts,correct,explain,success,apply);}
function audioGame(){const c=state.cams[state.index],i=state.index;camPanel(c.receivers?'Ajuste o ganho do receptor usando a fala de teste.':'Ajuste o microfone interno para áudio de referência de sincronização.',`<p>Meta simulada: picos de fala entre −12 e −6 dBFS, sem clipping. ${esc(state.kase.audio)}</p><div class="meter"><i id="mask"></i></div><div class="meterLabels"><span>−60</span><span>−24</span><span>−12</span><span>−6</span><span>0 dBFS</span></div><label for="gain">Ganho • pico <output id="peak"></output> dBFS</label><input id="gain" type="range" min="-36" max="6" value="-24" step="1"><button class="primary" id="validate">Confirmar nível</button>`);function draw(){const v=+$('gain').value;$('peak').textContent=v;$('mask').style.width=(100-Math.max(0,Math.min(100,(v+60)/60*100)))+'%'}$('gain').oninput=draw;draw();bind('validate',()=>{const v=+$('gain').value;if(v< -12||v> -6){note(v> -6?'Nível alto: risco de saturação. Reduza o ganho.':'Nível baixo: aumente o ganho para obter uma fala inteligível.');return}c.audio=true;advance('Áudio ajustado em '+v+' dBFS na câmera '+(i+1)+'.')});}

function activeLoc(){if(state.scene==='class')return classLoc;return locations.filter(l=>{if(l.id.startsWith('camera'))return l.obj.visible&&!state.cams[+l.id.slice(6)]?.mounted;if(l.id.startsWith('sd')||l.id.startsWith('rx'))return l.obj.visible;return true})}
function near(){const t=target();if(!t)return null;const list=activeLoc();let best=null,dist=Infinity;for(const l of list){const d=player.position.distanceTo(l.pos);if(d<(state.scene==='class'?2.65:l.id.startsWith('camera')||l.id.startsWith('sd')||l.id.startsWith('rx')?3.2:2.0)&&(d<dist||(l.id===t&&d<3.2))){best=l;dist=d;if(l.id===t)break}}return best;}

const ray=new THREE.Raycaster(),pointer=new THREE.Vector2();renderer.domElement.addEventListener('pointerdown',e=>{if(modal.open||!target())return;const b=renderer.domElement.getBoundingClientRect();pointer.set((e.clientX-b.left)/b.width*2-1,-(e.clientY-b.top)/b.height*2+1);ray.setFromCamera(pointer,currentCam());const list=activeLoc();const hits=ray.intersectObjects(list.map(x=>x.obj),true);if(hits.length){let o=hits[0].object;while(o&&!list.some(l=>l.obj===o))o=o.parent;const l=list.find(l=>l.obj===o);if(l&&player.position.distanceTo(l.pos)<(l.id.startsWith('camera')||l.id.startsWith('sd')||l.id.startsWith('rx')?3.2:2.65))activate(l.id);else if(l)message('Aproxime-se de '+l.label+'.');}});

return {near,highlight,gender:setGender,enter(c){setScene(c);sceneB.add(player);player.position.set(-4.9,0,4.5);player.rotation.y=Math.PI;camB.position.set(-4,8,14);look.set(-4,1,1);highlight(target())},classroom(){sceneC.add(player);player.position.set(0,0,7);camC.position.set(0,7,15);look.set(0,1,4)},pick(i){cameras[i].visible=false;heldModel=cameraModel();heldModel.scale.setScalar(.62);heldModel.position.set(0,.02,.22);student.hand.add(heldModel);},mount(i){if(heldModel){heldModel.removeFromParent();heldModel=null}const c=cameras[i],p=tripodPos[i];c.visible=true;c.position.set(p[0],1.82,p[1]);c.rotation.y=Math.atan2(p[0],p[1]+6.4);},take(kind,i){(kind==='sd'?cards:kind==='battery'?batteries:receivers)[i].visible=false},connect(i){const r=rxModel();r.scale.setScalar(.65);r.position.set(0,.61,.02);r.userData.addedRx=true;cameras[i].add(r)},power(i){cameras[i].userData.led.material.color.setHex(0x30d27b)},record(i){cameras[i].userData.led.material.color.setHex(0xff2727)},clap(){clapTop.rotation.z=0;try{const ctx=new (window.AudioContext||window.webkitAudioContext)();const n=ctx.createOscillator(),g=ctx.createGain();n.type='square';n.frequency.value=200;g.gain.setValueAtTime(.12,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.1);n.connect(g).connect(ctx.destination);n.start();n.stop(ctx.currentTime+.11);n.onended=()=>ctx.close()}catch(e){}},action(){stageStatus.material.map=canvasTex(512,100,(ctx,w,h)=>{ctx.fillStyle='#a51e27';ctx.fillRect(0,0,w,h);ctx.fillStyle='#fff';ctx.font='bold 55px Arial';ctx.textAlign='center';ctx.fillText('● GRAVANDO',w/2,70)});stageStatus.material.needsUpdate=true},run(){requestAnimationFrame(frame)}};
